name: Deploy to Cloudflare Pages

# 已停用：改為直接部署到 Cloudflare，不使用 GitHub Actions
on:
  workflow_dispatch:  # 僅手動觸發，push 不再觸發

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=TIDP-SUFee
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
